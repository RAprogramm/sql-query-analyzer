# release-plz creates the GitHub release and its changelog body when it
# pushes the `vX.Y.Z` tag. This workflow only attaches per-platform binary
# archives to that existing release — it never recreates or rewrites the
# release notes — and signs each archive with a SLSA build-provenance
# attestation verifiable via `gh attestation verify`.
#
# The tag push fires while release-plz is still finishing the release
# creation; the builds take minutes, so the release always exists by the
# time the upload step runs. `workflow_dispatch` re-builds assets for an
# existing tag on demand.

name: Release binaries

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build assets for (e.g. v0.16.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
      id-token: write # mint Sigstore signing certificate for attestations
      attestations: write # persist build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No dependency cache here on purpose: this workflow publishes
      # runtime artefacts, and a restored cache is an unverified input to
      # them (zizmor cache-poisoning). Release builds are rare enough that
      # a cold build is the right trade.

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../sql-query-analyzer-${{ matrix.target }}.tar.gz sql-query-analyzer

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/sql-query-analyzer.exe `
            -DestinationPath sql-query-analyzer-${{ matrix.target }}.zip

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sql-query-analyzer-${{ matrix.target }}.${{ matrix.archive }}

      - name: Attach archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "sql-query-analyzer-${{ matrix.target }}.${{ matrix.archive }}" --clobber
