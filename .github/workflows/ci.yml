name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Stage 1: PR size check (advisory report, does not gate the pipeline)
  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: RAprogramm/rust-prod-diff-checker@2f7f2953eb242aeadc77fddda4302a7b4757ab7d # v2.0.1
        with:
          max_prod_lines: '200'
          output_format: github
          post_comment: 'true'
          fail_on_exceed: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Detect changes
  detect:
    uses: ./.github/workflows/_detect.yml

  # Stage 3: All checks (parallel)
  fmt:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_fmt.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  clippy:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_clippy.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  qual:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/_qual.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  test:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_test.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  doc:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_doc.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  doctest:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_doctest.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  audit:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.deps == 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/_audit.yml
    with:
      deps_changed: ${{ needs.detect.outputs.deps }}

  deny:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.deps == 'true'
    uses: ./.github/workflows/_deny.yml
    with:
      deps_changed: ${{ needs.detect.outputs.deps }}

  reuse:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.reuse == 'true'
    uses: ./.github/workflows/_reuse.yml
    with:
      reuse_changed: ${{ needs.detect.outputs.reuse }}

  msrv:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_msrv.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  semver:
    needs: detect
    if: always() && needs.detect.result == 'success' && github.event_name == 'pull_request' && needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/_semver.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  machete:
    needs: detect
    if: always() && needs.detect.result == 'success' && needs.detect.outputs.deps == 'true'
    uses: ./.github/workflows/_machete.yml
    with:
      deps_changed: ${{ needs.detect.outputs.deps }}

  # Stage 4: Build (after all checks pass)
  build:
    needs: [detect, fmt, clippy, qual, test, doc, doctest, audit, deny, reuse, msrv, machete]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.rust == 'true' &&
      (needs.fmt.result == 'success' || needs.fmt.result == 'skipped') &&
      (needs.clippy.result == 'success' || needs.clippy.result == 'skipped') &&
      (needs.qual.result == 'success' || needs.qual.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.doc.result == 'success' || needs.doc.result == 'skipped') &&
      (needs.doctest.result == 'success' || needs.doctest.result == 'skipped') &&
      (needs.audit.result == 'success' || needs.audit.result == 'skipped') &&
      (needs.deny.result == 'success' || needs.deny.result == 'skipped') &&
      (needs.reuse.result == 'success' || needs.reuse.result == 'skipped') &&
      (needs.msrv.result == 'success' || needs.msrv.result == 'skipped') &&
      (needs.machete.result == 'success' || needs.machete.result == 'skipped')
    uses: ./.github/workflows/_build.yml
    with:
      rust_changed: ${{ needs.detect.outputs.rust }}

  # Releases are not part of CI: they are driven by the `Release-plz`
  # workflow (release PR -> merge -> publish), with binary assets and
  # attestations attached by `Release binaries` and `Release attestations`.

  # Aggregate gate: single required status context for branch protection
  ci-success:
    name: CI Success
    needs:
      [
        detect,
        fmt,
        clippy,
        qual,
        test,
        doc,
        doctest,
        audit,
        deny,
        reuse,
        msrv,
        semver,
        machete,
        build
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
