name: Quality Check

on:
  workflow_call:
    inputs:
      rust_changed:
        required: true
        type: string

jobs:
  qual:
    name: Quality Check
    runs-on: ubuntu-latest
    if: inputs.rust_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: RAprogramm/cargo-quality@c83f062068529b81b838a8b798a71a59706606f7 # v0.6.0
        with:
          path: .
          fail_on_issues: 'true'
          post_comment: ${{ github.event_name == 'pull_request' }}
