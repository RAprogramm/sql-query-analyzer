name: Create Release

on:
  workflow_call:
    inputs:
      new_tag:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Package crate
        run: cargo package --no-verify --allow-dirty

      - name: Locate .crate file
        id: artefact
        run: |
          set -euo pipefail
          crate=$(find target/package -maxdepth 1 -name '*.crate' -print -quit)
          if [ -z "$crate" ]; then
            echo "::error::No .crate file produced under target/package" >&2
            exit 1
          fi
          echo "path=$crate" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ./
          format: cyclonedx-json
          output-file: sql-query-analyzer-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.artefact.outputs.path }}
            sql-query-analyzer-sbom.cdx.json

      - name: Stage provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" sql-query-analyzer-provenance.sigstore.json

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/*
            sql-query-analyzer-sbom.cdx.json
            sql-query-analyzer-provenance.sigstore.json
            ${{ steps.artefact.outputs.path }}
