name: Dependency Check

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      deps_changed:
        required: true
        type: string

jobs:
  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    if: inputs.deps_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
