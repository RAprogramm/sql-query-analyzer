# Two-mode release automation driven by release-plz:
#
#   `release` runs first on every push to `main`. It is gated by
#                  `release_always = false` in `release-plz.toml`, so it
#                  publishes ONLY when the pushed commit belongs to a
#                  merged release PR (branch `release-plz-*`): it tags the
#                  commit, publishes to crates.io, and creates the matching
#                  GitHub release. Any other push is a no-op, so a feature
#                  merge can never ship an uncurated version. The command is
#                  idempotent: a version already on crates.io is skipped.
#   `release-pr`   -> keeps a single release PR open against `main`, bumping
#                  `Cargo.toml` and prepending a CHANGELOG section as
#                  conventional commits land. Merging that PR is therefore
#                  the only human action a release needs: the push it
#                  produces publishes it.
#
# `workflow_dispatch` re-runs the publish step against `main` HEAD; it is the
# escape hatch for a failed publish. `release-plz release` is idempotent, so
# a re-run is always safe. For partially published releases see the recovery
# steps in `RELEASE.md`.
#
# Authentication is via a dedicated GitHub App (`RELEASE_PLZ_APP_ID` +
# `RELEASE_PLZ_APP_PRIVATE_KEY` repository secrets). The App identity is
# required, not optional: PRs and releases created with the default
# `secrets.GITHUB_TOKEN` do not trigger downstream workflows (the `CI`
# checks on the release PR, `Release binaries`, `Release attestations`).
#
# See `release-plz.toml` for the configuration and `RELEASE.md` for the
# human-facing flow.

name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish merged release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'RAprogramm' && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == 'RAprogramm' }}
    needs: release
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # release-plz applies `pr_labels` but never creates the labels, so the
      # workflow guarantees its own prerequisite instead of failing silently
      # on a fresh clone of the repository.
      - name: Ensure the release label exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh label create release --repo "$GITHUB_REPOSITORY" --color B60205 --description "Release pull request" --force

      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
