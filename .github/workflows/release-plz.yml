# Release automation driven by release-plz, with publishing deliberately
# kept out of the automatic path:
#
#   push to `main`  -> `release-pr` ONLY: it reads the conventional
#                      commits since the last tag and opens (or updates)
#                      the single open release PR that bumps
#                      `Cargo.toml` and prepends a section to
#                      `CHANGELOG.md`. Nothing is tagged, nothing is
#                      published.
#   workflow_dispatch -> opt-in `release` (checkbox, off by default):
#                      the only way anything reaches crates.io. A human
#                      must merge the release PR AND explicitly run this
#                      workflow; `release-plz release` then tags the
#                      commit, publishes to crates.io, and creates the
#                      GitHub release with the curated changelog as its
#                      body. The command is idempotent.
#
# Authentication is via a dedicated GitHub App (`RELEASE_PLZ_APP_ID` +
# `RELEASE_PLZ_APP_PRIVATE_KEY` repository secrets). The App identity is
# required, not optional: PRs and releases created with the default
# `secrets.GITHUB_TOKEN` do not trigger downstream workflows (the `CI`
# checks on the release PR, `Release binaries`, `Release attestations`).
#
# See `release-plz.toml` for the configuration and `RELEASE.md` for the
# human-facing flow.

name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the merged release: tag, crates.io, GitHub release (release-plz release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == 'RAprogramm' }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Run release-plz release-pr
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish:
    name: Publish merged release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.repository_owner == 'RAprogramm' }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
