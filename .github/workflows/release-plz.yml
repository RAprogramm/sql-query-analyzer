# Release automation driven by release-plz, with publishing deliberately
# kept out of the automatic path:
#
#   push to `main`  -> `release-pr` ONLY: it reads the conventional
#                      commits since the last tag and opens (or updates)
#                      the single open release PR that bumps
#                      `Cargo.toml` and prepends a section to
#                      `CHANGELOG.md`. Nothing is tagged, nothing is
#                      published.
#   workflow_dispatch -> opt-in `release` (checkbox, off by default):
#                      the only way anything reaches crates.io. A human
#                      must merge the release PR AND explicitly run this
#                      workflow from `main`; dispatches from any other ref
#                      cannot publish: an unmerged release branch must
#                      never reach crates.io. `release-plz release` then
#                      tags the commit, publishes to crates.io, and
#                      creates the GitHub release with the curated
#                      changelog as its body. The command retries safely
#                      only while nothing was published yet; for partial
#                      failures see the recovery steps in `RELEASE.md`.
#                      An optional `revision` input pins the exact merged
#                      release commit to publish, so a later unrelated
#                      merge on main cannot silently turn the publish into
#                      a no-op; the workflow refuses any revision that is
#                      not reachable from main.
#
# Authentication is via a dedicated GitHub App (`RELEASE_PLZ_APP_ID` +
# `RELEASE_PLZ_APP_PRIVATE_KEY` repository secrets). The App identity is
# required, not optional: PRs and releases created with the default
# `secrets.GITHUB_TOKEN` do not trigger downstream workflows (the `CI`
# checks on the release PR, `Release binaries`, `Release attestations`).
#
# See `release-plz.toml` for the configuration and `RELEASE.md` for the
# human-facing flow.

name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the merged release: tag, crates.io, GitHub release (release-plz release)"
        type: boolean
        default: false
      revision:
        description: "Release revision on main to publish (merge commit of the release PR; empty = main HEAD)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.repository_owner == 'RAprogramm' }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # release-plz applies `pr_labels` but never creates the labels, so the
      # workflow guarantees its own prerequisite instead of failing silently
      # on a fresh clone of the repository.
      - name: Ensure the release label exists
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: gh label create release --repo "$GITHUB_REPOSITORY" --color B60205 --description "Release pull request" --force

      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish:
    name: Publish merged release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.repository_owner == 'RAprogramm' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App token
        id: app_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve release revision
        id: rev
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          rev="$INPUT_REVISION"
          if [ -z "$rev" ]; then
            rev=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$rev" --jq .sha >/dev/null
          echo "sha=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.rev.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app_token.outputs.token }}

      - name: Verify the revision is merged into main
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor "${{ steps.rev.outputs.sha }}" origin/main; then
            echo "::error::Release revision is not reachable from main; merge the release PR first" >&2
            exit 1
          fi

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Run release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
