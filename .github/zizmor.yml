# zizmor configuration. Each ignore below is a reviewed, deliberate
# exception — not a suppression of an unread finding.

rules:
  # crates.io trusted publishing is not configured for this crate yet;
  # publishing authenticates with a scoped CRATES_IO_TOKEN secret, which
  # the publish step of the Release-plz workflow passes to
  # release-plz.
  use-trusted-publishing:
    ignore:
      - release-plz.yml
  # GitHub's `uses: $/...` self-repository syntax is rejected by actionlint
  # 1.7.12 (rhysd/actionlint#732), which gates every PR here, so the
  # workspace-relative `uses: ./...` form stays until upstream accepts the
  # new syntax; then ci.yml flips to `$/` and this ignore goes away.
  self-repository:
    ignore:
      - ci.yml
