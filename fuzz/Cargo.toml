[package]
name = "fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sql_query_analyzer]
path = ".."

[[bin]]
name = "fuzz_preprocess"
path = "fuzz_targets/fuzz_preprocess.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_queries"
path = "fuzz_targets/fuzz_parse_queries.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_schema_parse"
path = "fuzz_targets/fuzz_schema_parse.rs"
test = false
doc = false
bench = false
